<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="860" viewBox="0 0 1600 860" font-family="Segoe UI, Inter, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9z" fill="#475569"/>
    </marker>
    <marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9z" fill="#7c3aed"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9z" fill="#0f766e"/>
    </marker>
    <style>
      .name { font-size: 22px; font-weight: 700; fill: #0f172a; }
      .sub { font-size: 16px; fill: #64748b; }
      .lbl { font-size: 15px; font-weight: 600; fill: #475569; }
      .ico { fill: none; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1600" height="860" fill="#ffffff"/>
  <text x="60" y="68" font-size="30" font-weight="800" fill="#0b3b6f">ShGAT — tizim qanday ishlaydi</text>
  <text x="60" y="98" class="sub">https://shgat.abbostech.uz</text>

  <!-- server chegarasi -->
  <rect x="420" y="215" width="640" height="510" rx="26" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="10 8"/>
  <text x="450" y="256" font-size="18" font-weight="700" fill="#475569">Server · Ubuntu</text>

  <!-- 1. Foydalanuvchi: noutbuk + brauzer -->
  <g transform="translate(190 360)">
    <circle r="78" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
    <g class="ico" stroke="#2563eb">
      <rect x="-40" y="-32" width="80" height="52" rx="6"/>
      <line x1="-40" y1="-20" x2="40" y2="-20"/>
      <circle cx="-32" cy="-26" r="1.2" fill="#2563eb"/>
      <circle cx="-25" cy="-26" r="1.2" fill="#2563eb"/>
      <path d="M-52 30 L52 30 L44 38 L-44 38 Z"/>
    </g>
    <text y="122" text-anchor="middle" class="name">Foydalanuvchi</text>
    <text y="148" text-anchor="middle" class="sub">Veb-brauzer</text>
  </g>

  <!-- 2. Caddy: qalqon + qulf -->
  <g transform="translate(580 360)">
    <circle r="78" fill="#ecfeff" stroke="#a5f3fc" stroke-width="2"/>
    <g class="ico" stroke="#0891b2">
      <path d="M0 -44 L36 -30 L36 2 C36 26 18 40 0 48 C-18 40 -36 26 -36 2 L-36 -30 Z"/>
      <rect x="-14" y="-4" width="28" height="22" rx="4"/>
      <path d="M-8 -4 V-12 A8 8 0 0 1 8 -12 V-4"/>
    </g>
    <text y="122" text-anchor="middle" class="name">Caddy</text>
    <text y="148" text-anchor="middle" class="sub">HTTPS · reverse proxy</text>
  </g>

  <!-- 3. Backend: server stoykasi -->
  <g transform="translate(900 360)">
    <circle r="78" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="2"/>
    <g class="ico" stroke="#16a34a">
      <rect x="-36" y="-40" width="72" height="22" rx="5"/>
      <rect x="-36" y="-11" width="72" height="22" rx="5"/>
      <rect x="-36" y="18" width="72" height="22" rx="5"/>
      <line x1="-24" y1="-29" x2="-12" y2="-29"/>
      <line x1="-24" y1="0" x2="-12" y2="0"/>
      <line x1="-24" y1="29" x2="-12" y2="29"/>
      <circle cx="24" cy="-29" r="2" fill="#16a34a"/>
      <circle cx="24" cy="0" r="2" fill="#16a34a"/>
      <circle cx="24" cy="29" r="2" fill="#16a34a"/>
    </g>
    <text y="122" text-anchor="middle" class="name">Backend</text>
    <text y="148" text-anchor="middle" class="sub">FastAPI · systemd</text>
  </g>

  <!-- 4. Baza: silindr -->
  <g transform="translate(900 618)">
    <circle r="62" fill="#fffbeb" stroke="#fde68a" stroke-width="2"/>
    <g class="ico" stroke="#d97706">
      <ellipse cx="0" cy="-24" rx="28" ry="9"/>
      <path d="M-28 -24 V22 A28 9 0 0 0 28 22 V-24"/>
      <path d="M-28 -1 A28 9 0 0 0 28 -1"/>
    </g>
    <text x="-80" y="-6" text-anchor="end" class="name">Ma'lumotlar bazasi</text>
    <text x="-80" y="20" text-anchor="end" class="sub">arizalar · fayllar</text>
  </g>

  <!-- 5. ArcGIS: bulut -->
  <g transform="translate(1340 360)">
    <circle r="78" fill="#f0fdfa" stroke="#99f6e4" stroke-width="2"/>
    <g class="ico" stroke="#0f766e">
      <path d="M-30 22 H32 A20 20 0 0 0 30 -18 A28 28 0 0 0 -22 -12 A18 18 0 0 0 -30 22 Z"/>
    </g>
    <text y="122" text-anchor="middle" class="name">ArcGIS</text>
    <text y="148" text-anchor="middle" class="sub">Esri xarita qatlami</text>
  </g>

  <!-- 6. Dasturchi: monitor + terminal -->
  <g transform="translate(190 660)">
    <circle r="78" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="2"/>
    <g class="ico" stroke="#7c3aed">
      <rect x="-42" y="-34" width="84" height="56" rx="6"/>
      <path d="M-26 -16 L-14 -6 L-26 4"/>
      <line x1="-6" y1="6" x2="14" y2="6"/>
      <line x1="0" y1="22" x2="0" y2="36"/>
      <line x1="-20" y1="38" x2="20" y2="38"/>
    </g>
    <text y="122" text-anchor="middle" class="name">Dasturchi</text>
    <text y="148" text-anchor="middle" class="sub">o'z kompyuteridan</text>
  </g>

  <!-- strelkalar -->
  <line x1="274" y1="660" x2="414" y2="660" stroke="#7c3aed" stroke-width="3" marker-end="url(#p)"/>
  <text x="344" y="632" text-anchor="middle" font-size="15" font-weight="700" fill="#7c3aed">SSH · 22-port</text>
  <text x="344" y="690" text-anchor="middle" font-size="14" fill="#7c3aed">SSH kalit bilan</text>
  <text x="344" y="710" text-anchor="middle" font-size="14" fill="#7c3aed">deploy.sh</text>
  <line x1="274" y1="360" x2="492" y2="360" stroke="#475569" stroke-width="3" marker-end="url(#a)"/>
  <text x="383" y="346" text-anchor="middle" class="lbl">HTTPS</text>

  <line x1="664" y1="360" x2="812" y2="360" stroke="#475569" stroke-width="3" marker-end="url(#a)"/>

  <line x1="900" y1="520" x2="900" y2="550" stroke="#475569" stroke-width="3" marker-end="url(#a)"/>

  <line x1="984" y1="360" x2="1252" y2="360" stroke="#0f766e" stroke-width="3" marker-end="url(#g)"/>
  <text x="1160" y="346" text-anchor="middle" font-size="15" font-weight="600" fill="#0f766e">chegarani yozish</text>

  <path d="M190 276 C 190 60, 1340 60, 1340 270" stroke="#0f766e" stroke-width="2.4" stroke-dasharray="9 7" fill="none" marker-end="url(#g)"/>
  <text x="765" y="104" text-anchor="middle" font-size="15" font-weight="600" fill="#0f766e">xaritani ko'rsatish (brauzer ArcGIS qatlamidan o'zi oladi)</text>
</svg>
